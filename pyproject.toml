[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honeychrome"
version = "1.0.0"
description = "Open Source GUI App for Cytometry Acquisition and Analysis "
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    'annoy==1.17.3',
    'anytree==2.13.0',
    'bitarray==3.8.0',
    'bokeh==3.8.2',
    'certifi==2026.4.22',
    'cffi==2.0.0',
    'charset-normalizer==3.4.7',
    'colorama==0.4.6',
    'colorcet==3.1.0',
    'contourpy==1.3.3',
    'cycler==0.12.1',
    'deepdiff==8.6.1',
    'FlowIO==1.4.0',
    'FlowKit==1.3.0',
    'FlowUtils==1.2.2',
    'fonttools==4.61.1',
    'ft4222==1.12.0',
    'graspologic-native==1.3.1',
    'hdbscan==0.8.44',
    'hnswlib==0.8.0',
    'idna==3.15',
    'Jinja2==3.1.6',
    'joblib==1.5.3',
    'kiwisolver==1.4.9',
    'llvmlite==0.48.0',
    'lxml==6.0.2',
    'MarkupSafe==3.0.3',
    'matplotlib==3.10.8',
    'narwhals==2.15.0',
    'networkx==3.6.1',
    'numba==0.66.0',
    'numpy==2.4.1',
    'openTSNE==1.0.4',
    'orderly-set==5.5.0',
    'packaging==25.0',
    'pacmap==0.8.0',
    'pandas==3.0.2',
    'pathvalidate==3.3.1',
    'patsy==1.0.2',
    'pillow==12.1.0',
    'psutil==7.2.1',
    'pyarrow==22.0.0',
    'pybind11==3.1.0',
    'pycparser==3.0',
    'pynndescent==0.6.0',
    'PyOpenGL==3.1.9',
    'pyparsing==3.3.1',
    'pyqtgraph==0.14.0',
    'PySide6==6.10.1',
    'PySide6_Addons==6.10.1',
    'PySide6_Essentials==6.10.1',
    'python-dateutil==2.9.0.post0',
    'python-docx==1.2.0',
    'pytz==2025.2',
    'PyYAML==6.0.3',
    'requests==2.34.2',
    'scikit-learn==1.8.0',
    'scipy==1.17.0',
    'seaborn==0.13.2',
    'sentry_sdk==2.59.0',
    'shiboken6==6.10.1',
    'six==1.17.0',
    'statsmodels==0.14.6',
    'threadpoolctl==3.6.0',
    'tornado==6.5.4',
    'tqdm==4.70.0',
    'typing_extensions==4.15.0',
    'tzdata==2025.3',
    'umap-learn==0.5.12',
    'urllib3==2.6.3',
    'xyzservices==2025.11.0'
]

[project.optional-dependencies]
dev = [
    'pytest>=8',
    'pytest-qt>=4.4',
]

[project.scripts]
honeychrome = "honeychrome.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"honeychrome" = [
    "data/*.csv",
    "**/*.svg", "**/*.png", "**/*.ico", "**/*.fcs",
    "bundled_plugins/*.csv",
    "bundled_plugins/*.c", "bundled_plugins/*.cpp", "bundled_plugins/*.hpp",
    "bundled_plugins/CMakeLists.txt",
]

# Compiled kernels are built on the user's machine and never shipped in the
# pure-Python wheel; _som_kernel.c is cffi's generated source.
[tool.setuptools.exclude-package-data]
"honeychrome" = [
    "bundled_plugins/_som_kernel.c",
    "**/*.so", "**/*.pyd", "**/*.dylib", "**/*.o",
]

# Optional: Testing configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"
markers = [
    "numpy_only: fast pure-numpy tests, no FCS files required",
    "controller: controller-level tests requiring an experiment on disk",
    "ui: GUI tests driven through pytest-qt",
]