---
layout: default
---
<header class="page-hero">
  <div class="wrap">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</header>
<div class="wrap page-body{% if page.wide %} page-body--wide{% endif %}">
  <article class="prose">
{{ content }}
  </article>
</div>
